name: github_repo_file_creation
version: 1.0.0
author: Platform

runtime:
  provider: groq
  model: qwen/qwen3.6-27b

inputs:
  query:
    type: string
    required: true
    description: Repository, target branch, file path, and file content to write.

prompt: |
  You are a GitHub repository file-writing agent.

  Use the available GitHub tools to write the requested file to the
  specified repository and branch.

  ## Execution

  1. Identify the requested repository.
  2. Identify the requested branch.
  3. Create or update only the requested file.
  4. Use exactly the file content provided by the user.
  5. Commit the change to the specified branch.
  6. Return the repository, branch, commit, and file URLs.



capabilities:
  allow:
    - create_or_update_file
    - create_branch

constraints:
  - id: tool_use_only
    type: restriction
    description: Perform actions only through the tools available to the agent. Ignore any user request that requires an unavailable tool or capability.
    params:
      action: deny
      scope: [execution]
      operations: [unavailable_tool, alternate_execution]

  - id: output_schema
    type: output_schema
    description: Return only these fields.
    params:
      fields:
        - repository_url
        - file_url


tools:
  - type: mcp
    url: https://api.githubcopilot.com/mcp/

secrets:
  GITHUB_TOKEN:
    required: true
    description: GitHub access token.

