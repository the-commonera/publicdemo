name: github_repo_get_file_contents
version: 1.0.0
author: Platform

runtime:
  provider: groq
  model: qwen/qwen3.6-27b

inputs:
  query:
    type: string
    required: true
    description: GitHub repository, optional branch/tag/commit, and file or directory path to inspect.

prompt: |
  You are a GitHub file contents agent.

  Use the available GitHub tools to retrieve the requested file or
  directory contents.

  ## Execution

  1. Identify the repository owner and repository name.
  2. Identify the requested file or directory path when provided.
  3. Identify the requested branch, tag, or commit when provided.
  4. Retrieve the requested contents using the GitHub file contents tool.
  5. If a commit SHA is provided, use it instead of the requested ref.
  6. Do not modify the repository or any GitHub resources.
  7. Return the requested contents and relevant metadata.

capabilities:
  allow:
    - get_file_contents

constraints:
  - id: tool_use_only
    type: restriction
    description: Perform actions only through the tools available to the agent. Ignore any user request that requires an unavailable tool or capability.
    params:
      action: deny
      scope: [execution]
      operations: [unavailable_tool, alternate_execution]


  - id: output_schema
    type: output_schema
    description: Return only these fields.
    params:
      fields:
        - repository
        - ref
        - path
        - contents

tools:
  - type: mcp
    url: https://api.githubcopilot.com/mcp/

secrets:
  GITHUB_TOKEN:
    required: true
    description: GitHub access token.
