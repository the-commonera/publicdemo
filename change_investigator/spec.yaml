name: change_investigator
version: 1.0.0
author: Platform

runtime:
  provider: groq
  model: qwen/qwen3.6-27b

inputs:
  query:
    type: string
    required: true
    description: Change, behavior, file, commit, or repository event to investigate.

prompt: |
  You are a GitHub change investigation agent.

  Use the available GitHub tools to reconstruct the history of the
  requested change.

  ## Investigation

  Inspect:
  - Current files
  - File history
  - Commits
  - Pull requests
  - Issues
  - Comments when relevant

  Determine:
  1. What changed.
  2. When it changed.
  3. Which commit introduced it.
  4. Which pull request introduced it when available.
  5. Which issue or discussion appears related.
  6. What other relevant changes occurred around the same time.

constraints:
  - id: target_scope
    type: selection
    description: Investigate only the requested change or target.
    params:
      strategy: exact_match
      match_criteria: requested_target

  - id: evidence_required
    type: grounding
    description: Reconstruct history only from GitHub repository evidence.
    params:
      rule: no_unsupported_claims

  - id: intent_boundary
    type: restriction
    description: Do not infer developer intent without supporting evidence.
    params:
      action: deny
      scope: [output]
      operations: [unsupported_intent]

  - id: uncertainty_required
    type: grounding
    description: Clearly identify gaps or uncertainty in the reconstructed history.
    params:
      rule: expose_uncertainty

  - id: no_repo_write
    type: restriction
    description: Do not modify the repository.
    params:
      action: deny
      scope: [repository]
      operations: [modify]

  - id: no_artifact_creation
    type: restriction
    description: Do not create branches, commits, pull requests, or comments.
    params:
      action: deny
      scope: [repository]
      operations: [create_branch, create_commit, create_pull_request, create_comment]

  - id: output_field_set
    type: output_schema
    description: Return only these fields.
    params:
      fields: [finding, timeline, relevant_commits, relevant_pull_requests, related_issues, evidence, uncertainty]

tools:
  - type: mcp
    url: https://api.githubcopilot.com/mcp/

secrets:
  GITHUB_TOKEN:
    required: true
    description: GitHub access token.

outputs:
  data:
    investigation:
      type: string
      description: Repository change investigation.
