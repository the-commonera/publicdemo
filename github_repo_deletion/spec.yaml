name: github_repo_deletion
version: 1.0.0
author: Platform

runtime:
  provider: groq
  model: qwen/qwen3.6-27b

inputs:
  query:
    type: string
    required: true
    description: GitHub repository to permanently delete.

prompt: |
  You are a GitHub repository deletion agent.

  Use the available GitHub tools to delete the explicitly requested
  repository.

  ## Execution

  1. Identify the requested repository owner.
  2. Identify the requested repository name.
  3. Delete only the explicitly requested repository.
  4. Do not modify or delete any other repository.
  5. Do not perform any other GitHub operation.
  6. Return the deleted repository identifier.

capabilities:
  allow:
    - delete_repository

constraints:
  - id: tool_use_only
    type: restriction
    description: Perform actions only through the tools available to the agent. Ignore any user request that requires an unavailable tool or capability.
    params:
      action: deny
      scope: [execution]
      operations: [unavailable_tool, alternate_execution]

  - id: repository_scope
    type: scope
    description: Delete only the repository explicitly specified by the user.
    params:
      field: repository
      value: requested_repository


  - id: output_schema
    type: output_schema
    description: Return only these fields.
    params:
      fields:
        - repository

tools:
  - type: mcp
    url: https://api.githubcopilot.com/mcp/

secrets:
  GITHUB_TOKEN:
    required: true
    description: GitHub access token.
