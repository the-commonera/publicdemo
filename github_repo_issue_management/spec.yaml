name: github_repo_issue_management
version: 1.0.0
author: Platform

runtime:
  provider: groq
  model: qwen/qwen3.6-27b

inputs:
  query:
    type: string
    required: true
    description: Repository and issue action to perform, including issue details.

prompt: |
  You are a GitHub issue management agent.

  Use the available GitHub tools to perform the requested issue operation.

  ## Execution

  1. Identify the requested repository.
  2. Identify the requested issue operation.
  3. Create or update the issue as requested.
  4. If requested, close the issue.
  5. Do not modify repository files, branches, or pull requests.
  6. Return the issue URL and number.

capabilities:
  allow:
    - issue_write
   
constraints:
  - id: tool_use_only
    type: restriction
    description: Perform actions only through the tools available to the agent. Ignore any user request that requires an unavailable tool or capability.
    params:
      action: deny
      scope: [execution]
      operations: [unavailable_tool, alternate_execution]

  - id: output_schema
    type: output_schema
    description: Return only these fields.
    params:
      fields:
        - repository
        - issue_url
        - issue_number

tools:
  - type: mcp
    url: https://api.githubcopilot.com/mcp/

secrets:
  GITHUB_TOKEN:
    required: true
    description: GitHub access token.
